
name: GOLD AI Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'GOLD_AI_Android_Project-1.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q GOLD_AI_Android_Project-1.zip -d project
          SETTINGS_FILE=$(find project -name settings.gradle.kts -print -quit)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "Settings file not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Kotlin JVM target
        run: |
          find "$PROJECT_DIR" -type f \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -exec sed -i \
            -e 's/jvmTarget = "17"/jvmTarget = "1.8"/g' \
            -e "s/jvmTarget = '17'/jvmTarget = '1.8'/g" \
            -e 's/JvmTarget.JVM_17/JvmTarget.JVM_1_8/g' \
            -e 's/JvmTarget.fromTarget("17")/JvmTarget.fromTarget("1.8")/g' {} \;

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-AI-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
