
name: GOLD AI Android Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'GOLD_AI_Android_Project-1.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q GOLD_AI_Android_Project-1.zip -d project
          SETTINGS_FILE=$(find project -name settings.gradle.kts -print -quit)
          test -n "$SETTINGS_FILE" || exit 1
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix JVM target
        run: |
          find "$PROJECT_DIR" -type f \( -name '*.gradle' -o -name '*.gradle.kts' \) -exec sed -i \
            -e 's/jvmTarget = "1.8"/jvmTarget = "17"/g' \
            -e "s/jvmTarget = '1.8'/jvmTarget = '17'/g" \
            -e 's/JvmTarget.JVM_1_8/JvmTarget.JVM_17/g' \
            -e 's/JvmTarget.fromTarget("1.8")/JvmTarget.fromTarget("17")/g' {} +

      - name: Verify JVM target
        run: |
          grep -R -n 'jvmTarget\|VERSION_1_8\|JVM_1_8' "$PROJECT_DIR" || true

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-AI-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
